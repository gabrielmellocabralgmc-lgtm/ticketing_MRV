# Rotinas automáticas do Ingressos MRV (a Vercel Hobby só tem cron diário).
# A cada 30 min chama /api/cron/tudo com o CRON_SECRET.
# Configure em GitHub → Settings → Secrets and variables → Actions:
#   SITE_URL     ex.: https://ticketing-mrv.vercel.app   (sem barra no final)
#   CRON_SECRET  o mesmo valor configurado na Vercel
name: Rotinas automáticas
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar rotinas
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Faltam os secrets SITE_URL/CRON_SECRET"; exit 1; fi
          curl -sS --fail-with-body --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/tudo"
