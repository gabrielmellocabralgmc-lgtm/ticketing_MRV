# Rotinas automáticas do Ingressos MRV (a Vercel Hobby só tem cron diário).
# A cada 30 min chama /api/cron/tudo com o CRON_SECRET.
# Configure em GitHub → Settings → Secrets and variables → Actions:
#   SITE_URL     ex.: https://ticketing-mrv.vercel.app   (sem barra no final)
#   CRON_SECRET  o mesmo valor configurado na Vercel
name: Rotinas automáticas
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar rotinas
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "::error::Faltam os secrets SITE_URL e/ou CRON_SECRET"; exit 1; fi
          URL="${SITE_URL%/}/api/cron/tudo"
          CODIGO=$(curl -sS -o resposta.txt -w '%{http_code}' --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$URL")
          echo "HTTP $CODIGO"; head -c 1500 resposta.txt; echo
          case "$CODIGO" in
            200) echo "Rotinas executadas." ;;
            401) echo "::error::401 — o CRON_SECRET do GitHub é diferente do CRON_SECRET da Vercel (ou ele não existe na Vercel)."; exit 1 ;;
            404) echo "::error::404 — confira o secret SITE_URL (endereço de produção da Vercel)."; exit 1 ;;
            *) echo "::error::Falha HTTP $CODIGO"; exit 1 ;;
          esac
